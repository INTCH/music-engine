# Hand-picked libraries. License rule: public-domain dedications only (CC0, Unlicense, explicit
# public domain) - music made with the engine must be entirely the user's, with no attribution,
# notice or royalty owed to anyone. `commit` pins exactly what gets downloaded.
# scripts/build_catalog.py turns these (plus the sfzinstruments org) into catalog_data/generated/.
#
# Removed / excluded on purpose:
#   Sonatina Symphonic Orchestra - Sampling Plus (no promo use), horns CC-BY-SA
#   Salamander Grand Piano       - CC-BY 3.0 (attribution required)
#   MuseScore_General / FluidR3  - MIT (copyright notice required)
#   CC-BY sfzinstruments repos   - DrumGizmo kits, NakedDrums, HeadroomPiano, Ixox flute, MTG sax, dim-cabasa
# The `credit` lines below are courtesy only; CC0 asks for nothing.


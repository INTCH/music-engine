# --- drums (GM key layout: 36 kick, 38 snare, 42/46 hats, 49 crash, 51 ride, 45/47/48 toms) ---
[[alias]]
name = "drumkit"
instrument = "karoryfer-big-rusty-drums/01-full"     # real acoustic kit, CC0, rendered through sfizz
sustain = false
[[alias]]
name = "world_perc"
instrument = "freepats-world-percussion/worldpercussion-20200905"   # 48-50 cajon, 51-53 bongo, 54-56 shaker,
sustain = false                                                    # 57-58 tamb, 67-68 maracas, 69 doum 70 tak 71 pa

# --- voices: no CC0 multisampled choir exists, so the choir is one recorded male singer
# stacked into a section (catalog_data/ensembles.toml). Range 36-63, "a" vowel only. ---
[[alias]]
name = "choir"
instrument = "choir_male"
[[alias]]
name = "voice"
instrument = "legato-vocal-tutorial/01-no-legato-polyphonic-only-no-vibrato-a"
attack = 0.3
release = 1.0
# the formant synth, refused unless the Score allows synths
[[alias]]
name = "voice_ooh"
instrument = "synth/voice-solo-ooh"
release = 1.8

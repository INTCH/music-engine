# Close-miked one-shots from recorded CC0 kits, as `catalog.kit` folders for s.hit.
# The sfz programs of these libraries play through sfizz; these entries reach single mics
# and articulations directly. Velocity layers are in the file names (_vl1 soft .. _vlN hard),
# round-robins as _rrN: filter with a pattern, e.g. kit("rusty/kick", "k_vl1[2-4]_*").

[[instrument]]
name = "rusty/kick"
library = "karoryfer.big-rusty-drums"
path = "Samples/kick_24/kick/kick"          # 24" kick, inside mic, 14 layers x 4 rr
files = "k_vl*.flac"
rule = "kit"
family = "drums"
tags = ["recorded", "kick", "acoustic", "close"]


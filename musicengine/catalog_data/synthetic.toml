# Sources whose sound is generated by software synthesis: the built-in synths, and libraries
# rendered from software synths. A Score refuses these unless it is created with
# allow_synth=True (see Score.__init__). The rule is about the sound, not the instrument
# type: a recording of real hardware (a sampled Yamaha TX81Z, a transistor organ, a drum
# machine) is a recording and is allowed, as are recordings of acoustic instruments played
# through a synth-style sfz program.
# Unknown origin counts as synthetic: a false entry costs one substitution, a missing one puts
# software-synth sound in a track that promised recordings only.
#
# Checked and allowed, for the next person who wonders:
#   vcsl/electrophones-* (TX81Z)   - "sampled from the original FM hardware" (VCSL Origin.txt)
#   karoryfer.caveman-cosmonaut    - samples of an Unitra B-11 transistor organ
#   karoryfer.cowsynth, squynth    - recorded bagpipes used as oscillators in an sfz program
#   karoryfer.string-cyborgs       - recorded double bass / cello in an sfz synth architecture

[synthetic]
libraries = [
  "synth",                                   # music-engine's own synths and 808/909 kits
  # FreePats: made in ZynAddSubFX / Yoshimi / Hexter software synths (per each readme)
  "freepats-fm-piano1", "freepats-fm-piano2", "freepats-lately-bass",
  "freepats-new-age", "freepats-sweep-pad",
  "freepats-synth-bass-1", "freepats-synth-bass-2", "freepats-synth-bass-lead",
  "freepats-synth-brass-1", "freepats-synth-brass-2", "freepats-synth-calliope",
  "freepats-synth-crystal", "freepats-synth-fifths", "freepats-synth-goblins",
  "freepats-synth-pad-bowed", "freepats-synth-pad-choir", "freepats-synth-scifi",
  "freepats-synth-soundtrack", "freepats-synth-square", "freepats-synth-strings-1",
  "freepats-synth-strings-2", "freepats-synthesizer-percussion",
]
# instrument-name globs, for libraries that mix sources
names = [
  "sonicpi/electronic-hits", "sonicpi/kicks", "sonicpi/snares", "sonicpi/hats",
  "sonicpi/percussion", "sonicpi/ambient",   # electronic one-shots of unknown origin
]
